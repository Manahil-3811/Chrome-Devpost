<!DOCTYPE html>
<html>
  <head>
    <title>AI Summary</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <h2>AI Summary</h2>

    <div class="options">
      <select id="summary-type" aria-label="Select summary type">
        <option value="brief">Brief Summary</option>
        <option value="detailed">Detailed Summary</option>
        <option value="bullets">Bullet Points</option>
      </select>
      <button id="summarize">Summarize This Page</button>
      <button id="copy-btn">Copy Summary</button>
    </div>

    <div id="result" aria-live="polite">
      Select a summary type and click 'Summarize This Page' to generate a summary.
    </div>

    <hr />
    <h2>AI Tab Grouping</h2>
    <div class="options">
      <button id="ai-group">Group Tabs with AI</button>
    </div>

    <div class="popup_options">
      <a href="options.html" target="_blank" rel="noopener">Settings</a>
    </div>

    <script src="config.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
